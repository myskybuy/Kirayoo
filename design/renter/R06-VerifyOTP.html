        <div class="otp">

          <input aria-label="Digit 3" value="1" inputmode="numeric">
          <input aria-label="Digit 4" value="7" inputmode="numeric">
          <input class="f" aria-label="Digit 5" value="" inputmode="numeric">
          <input aria-label="Digit 6" value="" inputmode="numeric">
        </div>
      </fieldset>
      <div style="padding:16px;border-radius:18px;background:#EEF3EC;display:flex;flex-direction:column;gap:6px">
        <label class="lbl" for="nm" style="margin:0">New here? Your full name</label>
        <input class="in" id="nm" type="text" value="Ananya Sharma" autocomplete="name">
        <span class="mute" style="font-size:12.5px">Use the name on your government ID. You'll verify it before your first payment.</span>

      <a class="btn btn-p" href="R07-Chat.html" style="width:100%">Verify &amp; continue</a>
